# Installer-Test Linux für eine Architektur – aufgerufen von installer-test.yml (je einmal für x64 und arm64, damit jede
# Architektur ihr Paket unabhängig von der anderen ins Release legt). Paket auf dem Zielsystem bauen (mitgeliefertes Node
# passt dann), als Artifact zum Herunterladen hochladen, in parallelen Runden echt installieren, aktualisieren, deinstallieren.
name: Installer-Test Linux

on:
  workflow_call:
    inputs:
      arch: { type: string, required: true } # x64 | arm64
      runner: { type: string, required: true } # ubuntu-latest | ubuntu-24.04-arm

jobs:
  paket:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Paket bauen
        run: npm run paket -- "$RUNNER_TEMP/pakete"

      - uses: actions/upload-artifact@v7
        with:
          name: Mosaik3LAB-Installer-linux-${{ inputs.arch }}
          path: ${{ runner.temp }}/pakete/Mosaik3LAB-Installer-*-linux-${{ inputs.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7 # abgeschlossene Läufe räumt der Job „aufraeumen“ weg

  test:
    name: test (${{ matrix.runde }})
    needs: [paket]
    strategy:
      fail-fast: false
      matrix:
        runde: [neu, v163, v180]
        include: # Runden „Update von einer freigegebenen Version“: alt = diese Version (Paket aus x-vs-x/mosaik3lab-pakete)
          - { runde: v163, alt: 1.6.3 }
          - { runde: v180, alt: 1.8.0 }
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: echo "PAKETE=$RUNNER_TEMP/pakete" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7 # für knopfdruck.mjs und pruefen.sh (reines Node, keine Abhängigkeiten)
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: Mosaik3LAB-Installer-linux-${{ inputs.arch }}
          path: ${{ runner.temp }}/pakete

      - name: Paket entpacken
        run: |
          paket=$(ls "$PAKETE"/Mosaik3LAB-Installer-*-linux-${{ inputs.arch }}.tar.gz | head -1)
          mkdir "$PAKETE/v1"
          tar xzf "$paket" -C "$PAKETE/v1"
          name=$(basename "$paket" .tar.gz)
          file "$PAKETE/v1/$name/node/node"
          "$PAKETE/v1/$name/node/node" --version
          # zweite Kopie mit anderem Commit in paket.json = „neue Version“ für den Update-Test
          cp -a "$PAKETE/v1" "$PAKETE/v2"
          node -e "const f=process.argv[1],fs=require('fs'),p=JSON.parse(fs.readFileSync(f));p.commit+='u';fs.writeFileSync(f,JSON.stringify(p,null,2))" "$PAKETE/v2/$name/paket.json"
          # v3 = absichtlich kaputtes Update: spielt eine neue Migration ein und beendet sich dann (nur diese Testkopie ist
          # verändert – im Programm gibt es dafür keinen Schalter). v0 = älteres Paket: kennt die neueste Migration nicht.
          mig=server/src/storage/sqlite/migrations
          letzte=$(ls "$PAKETE/v1/$name/$mig" | grep -E '^[0-9]{3}_.*\.sql$' | sort | tail -1)
          for v in v3 v0; do
            cp -a "$PAKETE/v1" "$PAKETE/$v"
            node -e "const f=process.argv[1],fs=require('fs'),p=JSON.parse(fs.readFileSync(f));p.commit+=process.argv[2];fs.writeFileSync(f,JSON.stringify(p,null,2))" "$PAKETE/$v/$name/paket.json" "$([ $v = v3 ] && echo kaputt || echo alt)"
          done
          echo 'CREATE TABLE ci_kaputt (x INTEGER);' > "$PAKETE/v3/$name/$mig/$(printf '%03d' $((10#${letzte:0:3} + 1)))_ci_kaputt.sql"
          # gebündelte Web-App: am Ende anhängen – läuft nach createApp (Migrationen eingespielt), dann Ende mit Code 3
          index="$PAKETE/v3/$name/server/dist/server.mjs"
          test -f "$index"
          printf "\nconsole.error('CI-Test: absichtlich kaputtes Paket');\nprocess.exit(3);\n" >> "$index"
          rm "$PAKETE/v0/$name/$mig/$letzte"
          echo "V1=$PAKETE/v1/$name" >> "$GITHUB_ENV"
          echo "V2=$PAKETE/v2/$name" >> "$GITHUB_ENV"
          echo "V3=$PAKETE/v3/$name" >> "$GITHUB_ENV"
          echo "V0=$PAKETE/v0/$name" >> "$GITHUB_ENV"

      # ---- Runde „neu“: Neuinstallation, Update, Rückfall, Downgrade, Update per Knopfdruck, Deinstallation ----
      # Vorher: ohne Administratorrechte bricht das Skript mit klarer Meldung ab und ändert nichts
      - name: Ohne Administratorrechte – klarer Abbruch
        if: matrix.runde == 'neu'
        timeout-minutes: 3
        run: |
          sudo useradd -m ohnerecht
          kopie=/tmp/m3l-ohne-root
          cp -r "$V1" "$kopie" && chmod -R a+rX "$kopie"
          set +e
          # Fall 1: Konto ohne sudo-Recht
          out=$(sudo -u ohnerecht sh "$kopie/installieren.sh" --still 2>&1); rc=$?
          echo "$out"
          [ "$rc" -eq 1 ] && echo "$out" | grep -q "Abbruch:" && echo "$out" | grep -q "Es wurde nichts verändert" || { echo "::error::Fall 1 (kein sudo-Recht) ohne klaren Abbruch (Code $rc)"; exit 1; }
          # Fall 2: sudo gar nicht installiert (PATH nur mit den nötigsten Programmen)
          mkdir -p /tmp/ohne-sudo-bin
          for c in sh id dirname basename pwd cat uname; do ln -sf "$(command -v "$c")" "/tmp/ohne-sudo-bin/$c"; done
          out=$(sudo -u ohnerecht env PATH=/tmp/ohne-sudo-bin sh "$kopie/installieren.sh" 2>&1); rc=$?
          echo "$out"
          [ "$rc" -eq 1 ] && echo "$out" | grep -q "sudo ist auf diesem Rechner nicht installiert" || { echo "::error::Fall 2 (sudo fehlt) ohne klaren Abbruch (Code $rc)"; exit 1; }
          test ! -e /opt/mosaik3lab || { echo "::error::/opt/mosaik3lab wurde trotz Abbruch angelegt"; exit 1; }
          sudo userdel -r ohnerecht 2>/dev/null; rm -rf "$kopie" /tmp/ohne-sudo-bin
          echo "OK: ohne Administratorrechte klarer Abbruch, nichts verändert"

      - name: Installieren (sudo ./installieren.sh --still)
        if: matrix.runde == 'neu'
        timeout-minutes: 14
        run: .github/installer-test/zeitlimit.sh 12 sudo "$V1/installieren.sh" --still

      - name: Prüfen nach der Installation
        if: matrix.runde == 'neu'
        run: .github/installer-test/pruefen.sh installiert

      - name: Testdaten anlegen
        if: matrix.runde == 'neu'
        run: .github/installer-test/pruefen.sh marker

      # Rechen-Thread im Paket (server/dist/bild-worker.mjs): Bilder hochladen, Vorschaubilder prüfen, Rechenzeit ins Log
      - name: Bilder hochladen und Vorschaubilder prüfen
        if: matrix.runde == 'neu'
        timeout-minutes: 5
        run: node .github/installer-test/bilder-pruefen.mjs

      - name: Mailversand einrichten (SMTP-Fänger, über den Manager)
        if: matrix.runde == 'neu'
        timeout-minutes: 5
        run: .github/installer-test/pruefen.sh mail-einrichten

      - name: Kommandozeile als root und ohne sudo
        if: matrix.runde == 'neu'
        timeout-minutes: 5
        run: .github/installer-test/pruefen.sh kommandozeile

      - name: Aktualisieren (sudo ./installieren.sh --still, neue Version)
        if: matrix.runde == 'neu'
        timeout-minutes: 14
        run: .github/installer-test/zeitlimit.sh 12 sudo "$V2/installieren.sh" --still

      - name: Prüfen nach dem Update
        if: matrix.runde == 'neu'
        run: |
          .github/installer-test/pruefen.sh installiert
          .github/installer-test/pruefen.sh erhalten
          # aktive Version merken: nach Rückfall und abgelehntem Downgrade muss genau sie wieder laufen
          echo "ERWARTET=$(node -p "require('/opt/mosaik3lab/current/.release.json').id")" >> "$GITHUB_ENV"

      - name: Mailversand nach dem Update (Einstellungen, Testmail, App-Mail)
        if: matrix.runde == 'neu'
        timeout-minutes: 5
        run: .github/installer-test/pruefen.sh mail-erhalten

      # Rückfall: das kaputte Update muss mit Fehler enden und automatisch auf die vorige Version zurückschalten
      - name: Rückfall-Test (kaputtes Update installieren)
        if: matrix.runde == 'neu'
        timeout-minutes: 14
        run: |
          set +e
          .github/installer-test/zeitlimit.sh 12 sudo "$V3/installieren.sh" --still 2>&1 | tee "$RUNNER_TEMP/v3.txt"
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" != 124 ] || { echo "FEHLER: das kaputte Update hängt (Zeitlimit) statt zurückzuschalten"; exit 1; }
          [ "$rc" != 0 ] || { echo "FEHLER: das kaputte Update endete mit Exit 0"; exit 1; }
          grep -q 'automatisch auf' "$RUNNER_TEMP/v3.txt" || { echo "FEHLER: keine Meldung zum Rückfall"; exit 1; }
          echo "OK   kaputtes Update endete mit Exit $rc und hat zurückgeschaltet"

      - name: Prüfen nach dem Rückfall
        if: matrix.runde == 'neu'
        run: |
          .github/installer-test/pruefen.sh installiert
          .github/installer-test/pruefen.sh erhalten
          .github/installer-test/pruefen.sh zurueck

      # Downgrade: ein älteres Paket (kennt die neueste Migration nicht) muss vor jeder Änderung abgelehnt werden
      - name: Downgrade-Test (älteres Paket installieren)
        if: matrix.runde == 'neu'
        timeout-minutes: 7
        run: |
          set +e
          .github/installer-test/zeitlimit.sh 5 sudo "$V0/installieren.sh" --still 2>&1 | tee "$RUNNER_TEMP/v0.txt"
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" != 124 ] || { echo "FEHLER: das ältere Paket hängt (Zeitlimit) statt sofort abgelehnt zu werden"; exit 1; }
          [ "$rc" != 0 ] || { echo "FEHLER: das ältere Paket wurde installiert"; exit 1; }
          grep -q 'Downgrade verweigert' "$RUNNER_TEMP/v0.txt" || { echo "FEHLER: keine Meldung „Downgrade verweigert“"; exit 1; }
          echo "OK   älteres Paket abgelehnt (Exit $rc)"

      - name: Prüfen nach dem abgelehnten Downgrade
        if: matrix.runde == 'neu'
        run: |
          .github/installer-test/pruefen.sh installiert
          .github/installer-test/pruefen.sh zurueck

      # Wie im Server-Manager „Jetzt aktualisieren“: höhere Version aus einer Test-Paketquelle, installiert vom Update-Helfer
      - name: Update per Knopfdruck (Update-Helfer)
        if: matrix.runde == 'neu'
        timeout-minutes: 14
        run: .github/installer-test/zeitlimit.sh 12 sudo "$(command -v node)" .github/installer-test/knopfdruck.mjs "$V1" /opt/mosaik3lab

      - name: Prüfen nach dem Update per Knopfdruck
        if: matrix.runde == 'neu'
        run: |
          .github/installer-test/pruefen.sh installiert
          .github/installer-test/pruefen.sh erhalten

      - name: Mailversand nach dem Update per Knopfdruck
        if: matrix.runde == 'neu'
        timeout-minutes: 5
        run: .github/installer-test/pruefen.sh mail-erhalten

      - name: Deinstallieren (Daten behalten)
        if: matrix.runde == 'neu'
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}
        run: sudo /opt/mosaik3lab/current/node/node /opt/mosaik3lab/current/manager/cli.mjs uninstall --yes

      - name: Prüfen nach der Deinstallation
        if: matrix.runde == 'neu'
        run: .github/installer-test/pruefen.sh deinstalliert

      # ---- Runden „v163“ und „v180“: Update von einer freigegebenen Version (matrix.alt) – die Stände, die installiert sind ----
      # Genau das Paket, das die Schule bekommen hat: aus dem öffentlichen Release (statt es aus dem Tag neu zu bauen)
      - name: Paket ${{ matrix.alt }} holen (Release v${{ matrix.alt }})
        if: matrix.runde != 'neu'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: x-vs-x/mosaik3lab-pakete # öffentliches Paket-Repository (dort liegen alle freigegebenen Versionen)
        run: |
          gh release download v${{ matrix.alt }} --pattern 'Mosaik3LAB-Installer-${{ matrix.alt }}-linux-${{ inputs.arch }}.tar.gz' --dir "$PAKETE/alt"
          paket="$PAKETE/alt/Mosaik3LAB-Installer-${{ matrix.alt }}-linux-${{ inputs.arch }}.tar.gz"
          test -f "$paket"
          mkdir "$PAKETE/altx"
          tar xzf "$paket" -C "$PAKETE/altx"
          echo "VALT=$PAKETE/altx/$(basename "$paket" .tar.gz)" >> "$GITHUB_ENV"

      - name: Version ${{ matrix.alt }} installieren (frische Daten)
        if: matrix.runde != 'neu'
        timeout-minutes: 14
        run: |
          sudo rm -rf /var/lib/mosaik3lab /var/backups/mosaik3lab /var/log/mosaik3lab
          .github/installer-test/zeitlimit.sh 12 sudo "$VALT/installieren.sh" --still

      - name: Prüfen (${{ matrix.alt }}) und Testdaten anlegen
        if: matrix.runde != 'neu'
        run: |
          .github/installer-test/pruefen.sh installiert
          .github/installer-test/pruefen.sh marker

      # Druckteil mit Bildern in der alten Version anlegen: nach dem Update müssen Datensätze und Dateien unverändert da sein
      - name: Testdaten mit ${{ matrix.alt }} (Druckteil mit Bildern)
        if: matrix.runde != 'neu'
        timeout-minutes: 5
        run: node .github/installer-test/bilder-pruefen.mjs --testdaten

      - name: Mailversand mit ${{ matrix.alt }} einrichten (SMTP-Fänger, über den Manager)
        if: matrix.runde != 'neu'
        timeout-minutes: 5
        run: .github/installer-test/pruefen.sh mail-einrichten

      - name: Daten vor dem Update merken (Zeilen je Tabelle, Dateien der Ablage)
        if: matrix.runde != 'neu'
        run: |
          sudo /opt/mosaik3lab/current/node/node .github/installer-test/daten-stand.mjs merken /var/lib/mosaik3lab/daten/mosaik3lab.db /var/lib/mosaik3lab/ablage "$RUNNER_TEMP/stand-alt.json"
          # installierte alte Version merken: nach dem Rückfall muss genau sie wieder laufen
          echo "ERWARTET=$(node -p "require('/opt/mosaik3lab/current/.release.json').id")" >> "$GITHUB_ENV"

      # Rückfall über Versionsgrenzen: Das kaputte Update spielt alle neuen Migrationen ein und stürzt dann ab. Danach muss
      # die alte Version wieder laufen – mit ihrer Datenbank von direkt vor dem Update (Schema und Inhalt) und allen Dateien.
      - name: Rückfall-Test (kaputtes Update über ${{ matrix.alt }})
        if: matrix.runde != 'neu'
        timeout-minutes: 14
        run: |
          set +e
          .github/installer-test/zeitlimit.sh 12 sudo "$V3/installieren.sh" --still 2>&1 | tee "$RUNNER_TEMP/v3.txt"
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" != 124 ] || { echo "FEHLER: das kaputte Update hängt (Zeitlimit) statt zurückzuschalten"; exit 1; }
          [ "$rc" != 0 ] || { echo "FEHLER: das kaputte Update endete mit Exit 0"; exit 1; }
          grep -q 'automatisch auf' "$RUNNER_TEMP/v3.txt" || { echo "FEHLER: keine Meldung zum Rückfall"; exit 1; }
          echo "OK   kaputtes Update endete mit Exit $rc und hat zurückgeschaltet"

      - name: Prüfen nach dem Rückfall auf ${{ matrix.alt }} (alte Version läuft, Daten wie vor dem Update)
        if: matrix.runde != 'neu'
        run: |
          .github/installer-test/pruefen.sh installiert
          .github/installer-test/pruefen.sh zurueck
          sudo /opt/mosaik3lab/current/node/node .github/installer-test/daten-stand.mjs vergleichen /var/lib/mosaik3lab/daten/mosaik3lab.db /var/lib/mosaik3lab/ablage "$RUNNER_TEMP/stand-alt.json"

      - name: Update ${{ matrix.alt }} → neue Version (installieren.sh)
        if: matrix.runde != 'neu'
        timeout-minutes: 14
        run: .github/installer-test/zeitlimit.sh 12 sudo "$V1/installieren.sh" --still

      - name: Prüfen nach dem Update von ${{ matrix.alt }}
        if: matrix.runde != 'neu'
        run: |
          .github/installer-test/pruefen.sh installiert
          .github/installer-test/pruefen.sh erhalten
          sudo /opt/mosaik3lab/current/node/node .github/installer-test/daten-stand.mjs vergleichen /var/lib/mosaik3lab/daten/mosaik3lab.db /var/lib/mosaik3lab/ablage "$RUNNER_TEMP/stand-alt.json"

      - name: Mailversand nach dem Update von ${{ matrix.alt }} (Einstellungen, Testmail, App-Mail)
        if: matrix.runde != 'neu'
        timeout-minutes: 5
        run: .github/installer-test/pruefen.sh mail-erhalten

      - name: Bildverarbeitung der neuen Version (nach dem Update von ${{ matrix.alt }})
        if: matrix.runde != 'neu'
        timeout-minutes: 5
        run: node .github/installer-test/bilder-pruefen.mjs

      # ---- Ende der Runden „v163“/„v180“: deinstallieren ----
      - name: Deinstallieren (Runde ${{ matrix.runde }})
        if: matrix.runde != 'neu'
        timeout-minutes: 5
        run: |
          (cd "$RUNNER_TEMP" && sudo /opt/mosaik3lab/current/node/node /opt/mosaik3lab/current/manager/cli.mjs uninstall --yes)
          .github/installer-test/pruefen.sh deinstalliert

      - name: Logs sammeln
        if: failure() || cancelled() # auch nach Abbruch (Zeitlimit des Jobs) – sonst fehlen genau dann die Protokolle
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          sudo cp -r /var/log/mosaik3lab "$RUNNER_TEMP/logs/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/ci-postfach" "$RUNNER_TEMP/logs/" 2>/dev/null || true # Mails beim SMTP-Fänger (Mail-Test)
          sudo cp /opt/mosaik3lab/install.json /var/lib/mosaik3lab/manager/install-manifest.json "$RUNNER_TEMP/logs/" 2>/dev/null || true
          sudo cp -r /var/lib/mosaik3lab/manager/dienste "$RUNNER_TEMP/logs/" 2>/dev/null || true
          for d in webapp backup portal manager; do sudo journalctl -u mosaik3lab-$d --no-pager > "$RUNNER_TEMP/logs/journal-$d.txt" 2>&1 || true; done
          systemctl list-units 'mosaik3lab-*' --all --no-pager > "$RUNNER_TEMP/logs/dienste.txt" 2>&1 || true
          sudo ls -laR /var/lib/mosaik3lab /var/backups/mosaik3lab > "$RUNNER_TEMP/logs/ordner.txt" 2>&1 || true
          ps -eo pid,ppid,user,etimes,stat,args --forest > "$RUNNER_TEMP/logs/prozesse.txt" 2>&1 || true
          sudo cp /opt/mosaik3lab/update-helfer.log /opt/mosaik3lab/update-status.json "$RUNNER_TEMP/logs/" 2>/dev/null || true
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/logs"

      - uses: actions/upload-artifact@v7
        if: failure() || cancelled() # auch nach Abbruch (Zeitlimit des Jobs) – sonst fehlen genau dann die Protokolle
        continue-on-error: true # voller Artefakt-Speicher darf den Test nie abbrechen
        with:
          name: installer-logs-linux-${{ inputs.arch }}-${{ matrix.runde }}
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore
          retention-days: 7

  # Manager-Tests auf einem eigenen, frischen Rechner (sie stoppen Dienste – neben einer Installation geht das nicht).
  # Pull Requests unter x64: läuft schon im Workflow „Prüfen“ (gleicher Rechnertyp) → hier nicht doppelt. Bei Tags und Pushes
  # läuft er immer – „release“ hängt daran (needs), es wird also nie ein Paket ohne bestandene Manager-Tests veröffentlicht.
  manager:
    if: ${{ inputs.arch != 'x64' || github.event_name != 'pull_request' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: npm run manager:test
        timeout-minutes: 3 # dauert sonst unter einer Minute
        run: npm run manager:test

  # Nur nach ALLEN bestandenen Tests dieser Architektur: genau das oben gebaute Paket (unverändert) als Download ablegen
  release:
    needs: [paket, test, manager]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest # nur Hochladen
    timeout-minutes: 10
    permissions:
      contents: write # getestetes Paket ins Release (.github/installer-test/release.sh; zählt nicht zum Artefakt-Speicher)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Mosaik3LAB-Installer-linux-${{ inputs.arch }}
          path: ${{ runner.temp }}/pakete

      - name: Getestetes Paket ins Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/installer-test/release.sh "$(ls "$RUNNER_TEMP"/pakete/Mosaik3LAB-Installer-*-linux-${{ inputs.arch }}.tar.gz | head -1)"
