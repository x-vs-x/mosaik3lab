# Installer-Test auf frischen Rechnern (Windows, Linux x64, Linux arm64 = Raspberry Pi OS 64 Bit): Paket bauen, echt
# installieren, aktualisieren, deinstallieren. Die Pakete gibt es danach als Artifact zum Herunterladen.
# Läuft von Hand (gh workflow run installer-test.yml), bei Pull Requests auf Installer/Manager/Workflows, bei Push auf
# installer-test/** und bei Tags vX.Y.Z – nicht bei jedem Push auf main. Beschreibung: docs/INSTALLATION.md
#
# Aufbau je System (alles auf eigenen, frischen Rechnern, parallel):
#   paket      Paket des getesteten Stands bauen (einmal) → Artifact; alle Testrunden installieren genau dieses Paket
#   test       je Runde ein Rechner: „neu“ (Neuinstallation, Update, Rückfall, Downgrade, Update per Knopfdruck,
#              Deinstallation), „v163“ und „v180“ (Update von den freigegebenen Versionen 1.6.3 und 1.8.0 – genau die
#              Stände, die installiert sind; ältere werden nicht mehr unterstützt, sie kommen zuerst auf 1.6.3). In diesen
#              Runden zuerst ein absichtlich kaputtes Update: Rückfall auf die alte Version mit zurückgespielter Datenbank
#   manager    npm run manager:test (stoppt Dienste – deshalb auf eigenem Rechner ohne Installation)
#   release    erst wenn ALLE Tests dieses Systems bestanden sind: genau das gebaute Paket ins Release (release.sh)
# Linux steht in installer-linux.yml (einmal je Architektur aufgerufen – jede veröffentlicht unabhängig von der anderen).
name: Installer-Test

on:
  workflow_dispatch:
  # Pull Requests, die Installer, Manager, Paketbau oder Datenbank-Migrationen betreffen: echter Installationstest vor dem Merge
  pull_request:
    branches: [main]
    paths: ['manager/**', 'scripts/**', '.github/**', 'server/src/storage/sqlite/migrations/**', 'package.json', 'package-lock.json']
  push:
    branches: ['installer-test/**']
    tags: ['v*'] # freigegebene Version (npm run release) → bestanden: Release vX.Y.Z mit allen drei Paketen

# Neuer Push auf denselben Pull Request bricht den laufenden Test ab (der ältere Stand interessiert nicht mehr).
# Tags, installer-test/** und Läufe von Hand bekommen je eine eigene Gruppe – die werden nie abgebrochen.
concurrency:
  group: installer-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Windows ----------------------------------------------------------------
  windows-paket:
    # „[nur-linux]“ in der Commit-Nachricht (Push) bzw. im Titel des Pull Requests lässt alle Windows-Jobs weg (spart Zeit beim Arbeiten an Linux)
    if: ${{ !contains(github.event.head_commit.message, '[nur-linux]') && !contains(github.event.pull_request.title, '[nur-linux]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Paket bauen
        run: npm run paket -- "$env:RUNNER_TEMP\pakete"

      - uses: actions/upload-artifact@v7
        with:
          name: Mosaik3LAB-Installer-windows-x64
          path: ${{ runner.temp }}/pakete/Mosaik3LAB-Installer-*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7 # abgeschlossene Läufe räumt der Job „aufraeumen“ weg

  windows:
    name: windows (${{ matrix.runde }})
    needs: [windows-paket]
    strategy:
      fail-fast: false
      matrix:
        runde: [neu, v163, v180]
        include: # Runden „Update von einer freigegebenen Version“: alt = diese Version (Paket aus x-vs-x/mosaik3lab-pakete)
          - { runde: v163, alt: 1.6.3 }
          - { runde: v180, alt: 1.8.0 }
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PAKETE: ${{ github.workspace }}\..\pakete
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7 # nur für knopfdruck.mjs (reines Node, keine Abhängigkeiten)
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: Mosaik3LAB-Installer-windows-x64
          path: ${{ env.PAKETE }}

      - name: Paket entpacken
        run: |
          $zip = Get-ChildItem "$env:PAKETE\Mosaik3LAB-Installer-*.zip" | Select-Object -First 1
          if (-not $zip) { throw 'Paket fehlt' }
          New-Item -ItemType Directory "$env:PAKETE\v1" | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $zip.FullName -C "$env:PAKETE\v1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # zweite Kopie mit anderem Commit in paket.json = „neue Version“ für den Update-Test
          Copy-Item "$env:PAKETE\v1" "$env:PAKETE\v2" -Recurse
          $p = Get-Content "$env:PAKETE\v2\paket.json" -Raw | ConvertFrom-Json
          $p.commit = "$($p.commit)u"
          $p | ConvertTo-Json | Set-Content "$env:PAKETE\v2\paket.json" -Encoding utf8
          # v3 = absichtlich kaputtes Update: spielt eine neue Migration ein und beendet sich dann (nur diese Testkopie ist
          # verändert – im Programm gibt es dafür keinen Schalter). v0 = älteres Paket: kennt die neueste Migration nicht.
          $mig = 'server\src\storage\sqlite\migrations'
          $letzte = Get-ChildItem "$env:PAKETE\v1\$mig" -Filter '*.sql' | Sort-Object Name | Select-Object -Last 1
          foreach ($v in 'v3', 'v0') {
            Copy-Item "$env:PAKETE\v1" "$env:PAKETE\$v" -Recurse
            $p = Get-Content "$env:PAKETE\$v\paket.json" -Raw | ConvertFrom-Json
            $p.commit = "$($p.commit)$(if ($v -eq 'v3') { 'kaputt' } else { 'alt' })"
            $p | ConvertTo-Json | Set-Content "$env:PAKETE\$v\paket.json" -Encoding utf8
          }
          Set-Content "$env:PAKETE\v3\$mig\$('{0:d3}' -f ([int]$letzte.Name.Substring(0, 3) + 1))_ci_kaputt.sql" 'CREATE TABLE ci_kaputt (x INTEGER);' -Encoding utf8
          # gebündelte Web-App: am Ende anhängen – läuft nach createApp (Migrationen eingespielt), dann Ende mit Code 3
          $index = "$env:PAKETE\v3\server\dist\server.mjs"
          if (-not (Test-Path $index)) { throw "Bündel fehlt: $index" }
          Add-Content $index "`nconsole.error('CI-Test: absichtlich kaputtes Paket');`nprocess.exit(3);" -Encoding utf8
          Remove-Item "$env:PAKETE\v0\$mig\$($letzte.Name)"

      # Das Runner-Abbild hat einen Webserver (IIS/http.sys) auf Port 80 – auf dem Schulrechner gibt es den nicht
      - name: Port 80 freimachen (nur Runner)
        run: |
          Get-NetTCPConnection -LocalPort 80 -State Listen -ErrorAction SilentlyContinue | Format-Table LocalAddress, OwningProcess
          foreach ($s in 'W3SVC', 'WAS', 'IISADMIN') { if (Get-Service $s -ErrorAction SilentlyContinue) { Stop-Service $s -Force; Write-Host "gestoppt: $s" } }
          netsh http show servicestate view=requestq
          Get-NetTCPConnection -LocalPort 80 -State Listen -ErrorAction SilentlyContinue | Format-Table LocalAddress, OwningProcess

      # ---- Runde „neu“: Neuinstallation, Update, Rückfall, Downgrade, Update per Knopfdruck, Deinstallation ----
      - name: Installieren (Installieren.cmd /still)
        if: matrix.runde == 'neu'
        timeout-minutes: 14
        shell: cmd
        run: call "%PAKETE%\v1\Installieren.cmd" /still

      - name: Prüfen nach der Installation
        if: matrix.runde == 'neu'
        run: .github/installer-test/pruefen.ps1 installiert

      - name: Testdaten anlegen
        if: matrix.runde == 'neu'
        run: .github/installer-test/pruefen.ps1 marker

      # Rechen-Thread im Paket (server\dist\bild-worker.mjs): Bilder hochladen, Vorschaubilder prüfen, Rechenzeit ins Log
      - name: Bilder hochladen und Vorschaubilder prüfen
        if: matrix.runde == 'neu'
        timeout-minutes: 5
        run: node .github/installer-test/bilder-pruefen.mjs

      - name: Aktualisieren (Installieren.cmd /still, neue Version)
        if: matrix.runde == 'neu'
        timeout-minutes: 14
        shell: cmd
        run: call "%PAKETE%\v2\Installieren.cmd" /still

      - name: Prüfen nach dem Update
        if: matrix.runde == 'neu'
        run: |
          foreach ($p in 'installiert', 'erhalten') { .github/installer-test/pruefen.ps1 $p; if ($LASTEXITCODE) { exit 1 } }
          # aktive Version merken: nach Rückfall und abgelehntem Downgrade muss genau sie wieder laufen
          "ERWARTET=$((Get-Content "$env:ProgramFiles\Mosaik3LAB\current\.release.json" -Raw | ConvertFrom-Json).id)" >> $env:GITHUB_ENV

      # Rückfall: das kaputte Update muss mit Fehler enden und automatisch auf die vorige Version zurückschalten
      - name: Rückfall-Test (kaputtes Update installieren)
        if: matrix.runde == 'neu'
        timeout-minutes: 14
        shell: cmd
        run: |
          call "%PAKETE%\v3\Installieren.cmd" /still > "%RUNNER_TEMP%\v3.txt" 2>&1
          set RC=%ERRORLEVEL%
          type "%RUNNER_TEMP%\v3.txt"
          if "%RC%"=="0" (echo FEHLER: das kaputte Update endete mit Exit 0& exit /b 1)
          findstr /c:"automatisch auf" "%RUNNER_TEMP%\v3.txt" >nul || (echo FEHLER: keine Meldung zum Rueckfall& exit /b 1)
          echo OK   kaputtes Update endete mit Exit %RC% und hat zurueckgeschaltet

      - name: Prüfen nach dem Rückfall
        if: matrix.runde == 'neu'
        run: foreach ($p in 'installiert', 'erhalten', 'zurueck') { .github/installer-test/pruefen.ps1 $p; if ($LASTEXITCODE) { exit 1 } }

      # Downgrade: ein älteres Paket (kennt die neueste Migration nicht) muss vor jeder Änderung abgelehnt werden
      - name: Downgrade-Test (älteres Paket installieren)
        if: matrix.runde == 'neu'
        timeout-minutes: 7
        shell: cmd
        run: |
          call "%PAKETE%\v0\Installieren.cmd" /still > "%RUNNER_TEMP%\v0.txt" 2>&1
          set RC=%ERRORLEVEL%
          type "%RUNNER_TEMP%\v0.txt"
          if "%RC%"=="0" (echo FEHLER: das aeltere Paket wurde installiert& exit /b 1)
          findstr /c:"Downgrade verweigert" "%RUNNER_TEMP%\v0.txt" >nul || (echo FEHLER: keine Meldung Downgrade verweigert& exit /b 1)
          echo OK   aelteres Paket abgelehnt, Exit %RC%

      - name: Prüfen nach dem abgelehnten Downgrade
        if: matrix.runde == 'neu'
        run: foreach ($p in 'installiert', 'zurueck') { .github/installer-test/pruefen.ps1 $p; if ($LASTEXITCODE) { exit 1 } }

      # Wie im Server-Manager „Jetzt aktualisieren“: höhere Version aus einer Test-Paketquelle, installiert vom Update-Helfer
      - name: Update per Knopfdruck (Update-Helfer)
        if: matrix.runde == 'neu'
        timeout-minutes: 14
        run: |
          node .github/installer-test/knopfdruck.mjs "$env:PAKETE\v1" (Join-Path $env:ProgramFiles 'Mosaik3LAB')
          if ($LASTEXITCODE) { exit 1 }

      - name: Prüfen nach dem Update per Knopfdruck
        if: matrix.runde == 'neu'
        run: foreach ($p in 'installiert', 'erhalten') { .github/installer-test/pruefen.ps1 $p; if ($LASTEXITCODE) { exit 1 } }

      - name: Deinstallieren (Daten behalten)
        if: matrix.runde == 'neu'
        timeout-minutes: 7
        working-directory: ${{ runner.temp }}
        run: |
          $p = Join-Path $env:ProgramFiles 'Mosaik3LAB\current'
          & "$p\node\node.exe" "$p\manager\cli.mjs" uninstall --yes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Prüfen nach der Deinstallation
        if: matrix.runde == 'neu'
        run: .github/installer-test/pruefen.ps1 deinstalliert

      # ---- Runden „v163“ und „v180“: Update von einer freigegebenen Version (matrix.alt) – die Stände, die installiert sind ----
      # Genau das Paket, das die Schule bekommen hat: aus dem öffentlichen Release (statt es aus dem Tag neu zu bauen)
      - name: Paket ${{ matrix.alt }} holen (Release v${{ matrix.alt }})
        if: matrix.runde != 'neu'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: x-vs-x/mosaik3lab-pakete # öffentliches Paket-Repository (dort liegen alle freigegebenen Versionen)
        run: |
          gh release download v${{ matrix.alt }} --pattern 'Mosaik3LAB-Installer-${{ matrix.alt }}-windows-x64.zip' --dir "$env:PAKETE\alt"
          if ($LASTEXITCODE) { exit 1 }
          $zip = Get-ChildItem "$env:PAKETE\alt\Mosaik3LAB-Installer-${{ matrix.alt }}-*.zip" | Select-Object -First 1
          if (-not $zip) { throw 'Paket ${{ matrix.alt }} fehlt' }
          New-Item -ItemType Directory "$env:PAKETE\altx" | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $zip.FullName -C "$env:PAKETE\altx"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Version ${{ matrix.alt }} installieren (frische Daten)
        if: matrix.runde != 'neu'
        timeout-minutes: 14
        shell: cmd
        run: |
          if exist C:\Mosaik3LAB rmdir /s /q C:\Mosaik3LAB
          call "%PAKETE%\altx\Installieren.cmd" /still

      - name: Prüfen (${{ matrix.alt }}) und Testdaten anlegen
        if: matrix.runde != 'neu'
        run: foreach ($p in 'installiert', 'marker') { .github/installer-test/pruefen.ps1 $p; if ($LASTEXITCODE) { exit 1 } }

      # Druckteil mit Bildern in der alten Version anlegen: nach dem Update müssen Datensätze und Dateien unverändert da sein
      - name: Testdaten mit ${{ matrix.alt }} (Druckteil mit Bildern)
        if: matrix.runde != 'neu'
        timeout-minutes: 5
        run: node .github/installer-test/bilder-pruefen.mjs --testdaten

      - name: Daten vor dem Update merken (Zeilen je Tabelle, Dateien der Ablage)
        if: matrix.runde != 'neu'
        run: |
          & "$env:ProgramFiles\Mosaik3LAB\current\node\node.exe" .github/installer-test/daten-stand.mjs merken C:\Mosaik3LAB\daten\mosaik3lab.db C:\Mosaik3LAB\ablage "$env:RUNNER_TEMP\stand-alt.json"
          if ($LASTEXITCODE) { exit 1 }
          # installierte alte Version merken: nach dem Rückfall muss genau sie wieder laufen
          "ERWARTET=$((Get-Content "$env:ProgramFiles\Mosaik3LAB\current\.release.json" -Raw | ConvertFrom-Json).id)" >> $env:GITHUB_ENV

      # Rückfall über Versionsgrenzen: Das kaputte Update spielt alle neuen Migrationen ein und stürzt dann ab. Danach muss
      # die alte Version wieder laufen – mit ihrer Datenbank von direkt vor dem Update (Schema und Inhalt) und allen Dateien.
      - name: Rückfall-Test (kaputtes Update über ${{ matrix.alt }})
        if: matrix.runde != 'neu'
        timeout-minutes: 14
        shell: cmd
        run: |
          call "%PAKETE%\v3\Installieren.cmd" /still > "%RUNNER_TEMP%\v3.txt" 2>&1
          set RC=%ERRORLEVEL%
          type "%RUNNER_TEMP%\v3.txt"
          if "%RC%"=="0" (echo FEHLER: das kaputte Update endete mit Exit 0& exit /b 1)
          findstr /c:"automatisch auf" "%RUNNER_TEMP%\v3.txt" >nul || (echo FEHLER: keine Meldung zum Rueckfall& exit /b 1)
          echo OK   kaputtes Update endete mit Exit %RC% und hat zurueckgeschaltet

      - name: Prüfen nach dem Rückfall auf ${{ matrix.alt }} (alte Version läuft, Daten wie vor dem Update)
        if: matrix.runde != 'neu'
        run: |
          foreach ($p in 'installiert', 'zurueck') { .github/installer-test/pruefen.ps1 $p; if ($LASTEXITCODE) { exit 1 } }
          & "$env:ProgramFiles\Mosaik3LAB\current\node\node.exe" .github/installer-test/daten-stand.mjs vergleichen C:\Mosaik3LAB\daten\mosaik3lab.db C:\Mosaik3LAB\ablage "$env:RUNNER_TEMP\stand-alt.json"
          if ($LASTEXITCODE) { exit 1 }

      - name: Update ${{ matrix.alt }} → neue Version (Installieren.cmd)
        if: matrix.runde != 'neu'
        timeout-minutes: 14
        shell: cmd
        run: call "%PAKETE%\v1\Installieren.cmd" /still

      - name: Prüfen nach dem Update von ${{ matrix.alt }}
        if: matrix.runde != 'neu'
        run: |
          foreach ($p in 'installiert', 'erhalten') { .github/installer-test/pruefen.ps1 $p; if ($LASTEXITCODE) { exit 1 } }
          & "$env:ProgramFiles\Mosaik3LAB\current\node\node.exe" .github/installer-test/daten-stand.mjs vergleichen C:\Mosaik3LAB\daten\mosaik3lab.db C:\Mosaik3LAB\ablage "$env:RUNNER_TEMP\stand-alt.json"
          if ($LASTEXITCODE) { exit 1 }

      - name: Bildverarbeitung der neuen Version (nach dem Update von ${{ matrix.alt }})
        if: matrix.runde != 'neu'
        timeout-minutes: 5
        run: node .github/installer-test/bilder-pruefen.mjs

      # ---- Ende der Runden „v163“/„v180“: deinstallieren ----
      - name: Deinstallieren (Runde ${{ matrix.runde }})
        if: matrix.runde != 'neu'
        timeout-minutes: 7
        run: |
          $p = Join-Path $env:ProgramFiles 'Mosaik3LAB\current'
          Push-Location $env:RUNNER_TEMP
          & "$p\node\node.exe" "$p\manager\cli.mjs" uninstall --yes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          .github/installer-test/pruefen.ps1 deinstalliert; if ($LASTEXITCODE) { exit 1 }

      - name: Logs sammeln
        if: failure() || cancelled() # auch nach Abbruch (Zeitlimit des Jobs) – sonst fehlen genau dann die Protokolle
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\logs" | Out-Null
          Get-ChildItem C:\Mosaik3LAB\logs -Recurse -File -ErrorAction SilentlyContinue | Copy-Item -Destination "$env:RUNNER_TEMP\logs"
          # Dienstdateien, install.json, Manifest (ohne releases\…\node_modules)
          Get-ChildItem (Join-Path $env:ProgramFiles 'Mosaik3LAB') -Recurse -Depth 1 -Include *.log, *.xml, *.json -ErrorAction SilentlyContinue | Copy-Item -Destination "$env:RUNNER_TEMP\logs" -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Service -Filter "Name LIKE 'mosaik3lab-%'" | Format-Table Name, State, StartMode, PathName -AutoSize | Out-String -Width 300 | Set-Content "$env:RUNNER_TEMP\logs\dienste.txt"

      - uses: actions/upload-artifact@v7
        if: failure() || cancelled() # auch nach Abbruch (Zeitlimit des Jobs) – sonst fehlen genau dann die Protokolle
        continue-on-error: true # voller Artefakt-Speicher darf den Test nie abbrechen
        with:
          name: installer-logs-windows-${{ matrix.runde }}
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore
          retention-days: 7

  # Manager-Tests unter Windows auf einem eigenen, frischen Rechner (sie stoppen Dienste – neben einer Installation geht das nicht)
  manager-windows:
    if: ${{ !contains(github.event.head_commit.message, '[nur-linux]') && !contains(github.event.pull_request.title, '[nur-linux]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: npm run manager:test
        timeout-minutes: 5 # dauert unter Windows etwa 2 Minuten
        run: npm run manager:test

  # Nur nach ALLEN bestandenen Windows-Tests: genau das oben gebaute Paket (unverändert) als Download ablegen
  windows-release:
    needs: [windows-paket, windows, manager-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest # nur Hochladen – braucht keinen Windows-Rechner
    timeout-minutes: 10
    permissions:
      contents: write # getestetes Paket ins Release (.github/installer-test/release.sh; zählt nicht zum Artefakt-Speicher)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Mosaik3LAB-Installer-windows-x64
          path: ${{ runner.temp }}/pakete

      - name: Getestetes Paket ins Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/installer-test/release.sh "$(ls "$RUNNER_TEMP"/pakete/Mosaik3LAB-Installer-*-windows-x64.zip | head -1)"

  # ---------------------------------------------------------------- Linux ----------------------------------------------------------------
  # Linux x64 und Raspberry Pi (arm64, wie Raspberry Pi OS 64 Bit) – Ablauf in installer-linux.yml
  linux-x64:
    uses: ./.github/workflows/installer-linux.yml
    with:
      arch: x64
      runner: ubuntu-latest
    permissions:
      contents: write

  linux-arm64:
    uses: ./.github/workflows/installer-linux.yml
    with:
      arch: arm64
      runner: ubuntu-24.04-arm
    permissions:
      contents: write

  # Aufräumen nach jedem Lauf (auch nach Fehlern): Artefakte anderer, schon ABGESCHLOSSENER Läufe löschen, damit der
  # Artefakt-Speicher nie volläuft. Läufe, die noch laufen (z. B. parallel in einem anderen Pull Request), behalten ihre
  # Artefakte – sonst fehlen ihnen Pakete beim Herunterladen (Lauf 44275682317). Artefakte jünger als eine Stunde bleiben
  # ebenfalls (Puffer für „Re-run failed jobs“ und Läufe, deren Status gerade wechselt); der nächste Lauf räumt sie weg.
  aufraeumen:
    needs: [windows-paket, windows, manager-windows, windows-release, linux-x64, linux-arm64]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Artefakte abgeschlossener Läufe löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grenze=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ) # gleiches Format wie created_at → Textvergleich genügt
          filter=".artifacts[] | select((.expired | not) and .workflow_run.id != $GITHUB_RUN_ID) | \"\(.id) \(.workflow_run.id) \(.created_at) \(.name)\""
          declare -A status # Status je Lauf nur einmal abfragen
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" -q "$filter" |
            while read -r id lauf erstellt name; do
              if [[ "$erstellt" > "$grenze" ]]; then echo "behalten: $name (Lauf $lauf, jünger als 1 Stunde)"; continue; fi
              # gelöschter Lauf (404) = verwaistes Artefakt → wie abgeschlossen behandeln
              [ -n "${status[$lauf]:-}" ] || status[$lauf]=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$lauf" -q .status 2>/dev/null || echo completed)
              if [ "${status[$lauf]}" != completed ]; then echo "behalten: $name (Lauf $lauf: ${status[$lauf]})"; continue; fi
              # parallel aufräumende Läufe können dasselbe Artefakt schon gelöscht haben → kein Fehler
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null 2>&1 && echo "gelöscht: $name (Lauf $lauf)" || echo "nicht gelöscht (schon weg?): $name"
            done
